name: Xentryx Analyzer
description: A GitHub Action that analyzes your Flutter project

branding:
  icon: shield
  color: blue

inputs:
  flutter-channel:
    description: The Flutter channel to use
    default: stable
    required: false

runs:
  using: composite
  steps:
    - name: Flutter Setup
      uses: subosito/flutter-action@v2
      with:
        channel: ${{ inputs.flutter-channel }}
    - name: Run Checks
      shell: bash
      run: bash "${{github.action_path}}/shellexec.sh"