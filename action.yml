name: Laenel Flutter Analyzer
description: A GitHub Action that analyzes your Flutter project

inputs:
  version:
    description: The Flutter version to use
    default: stable
    required: false

runs:
  using: composite
  steps:
    - name: Flutter Setup
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.version }}
    - name: Run Checks
      shell: bash
      run: bash "${{github.action_path}}/shellexec.sh"